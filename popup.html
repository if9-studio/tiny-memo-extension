<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tiny Memo</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="popup-header">
      <div class="brand-title">
        <img src="icons/icon16.png" alt="" width="16" height="16" />
        <span id="appBrandName">Tiny Memo</span>
      </div>
      <details class="lang-menu" id="languageMenu" data-lang-menu>
        <summary id="languageMenuTrigger" aria-label="Interface language" title="Interface language">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
            <path d="M2 12h20" />
          </svg>
        </summary>
        <ul id="languageMenuList" role="menu" aria-label="Interface language">
          <li><button type="button" class="lang-option" role="menuitemradio" data-lang-value="system" id="optLangSystem" aria-checked="true"><span class="lang-option-label">System</span><svg class="lang-check" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></button></li>
          <li><button type="button" class="lang-option" role="menuitemradio" data-lang-value="en" lang="en" aria-checked="false"><span class="lang-option-label">English</span><svg class="lang-check" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></button></li>
          <li><button type="button" class="lang-option" role="menuitemradio" data-lang-value="ja" lang="ja" aria-checked="false"><span class="lang-option-label">日本語</span><svg class="lang-check" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></button></li>
          <li><button type="button" class="lang-option" role="menuitemradio" data-lang-value="zh-CN" lang="zh-CN" aria-checked="false"><span class="lang-option-label">简体中文</span><svg class="lang-check" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></button></li>
          <li><button type="button" class="lang-option" role="menuitemradio" data-lang-value="zh-TW" lang="zh-TW" aria-checked="false"><span class="lang-option-label">繁體中文</span><svg class="lang-check" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></button></li>
          <li><button type="button" class="lang-option" role="menuitemradio" data-lang-value="ko" lang="ko" aria-checked="false"><span class="lang-option-label">한국어</span><svg class="lang-check" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></button></li>
          <li><button type="button" class="lang-option" role="menuitemradio" data-lang-value="de" lang="de" aria-checked="false"><span class="lang-option-label">Deutsch</span><svg class="lang-check" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></button></li>
          <li><button type="button" class="lang-option" role="menuitemradio" data-lang-value="fr" lang="fr" aria-checked="false"><span class="lang-option-label">Français</span><svg class="lang-check" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></button></li>
          <li><button type="button" class="lang-option" role="menuitemradio" data-lang-value="es" lang="es" aria-checked="false"><span class="lang-option-label">Español</span><svg class="lang-check" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></button></li>
        </ul>
      </details>
    </header>

    <div class="notes-header">
      <h4 id="notesHeading">Collected notes</h4>
      <span id="notesCountBadge" class="note-count">0 notes</span>
    </div>
    <textarea id="notesDisplay" readonly placeholder=""></textarea>

    <div class="settings">
      <div class="settings-section-title">
        <span class="inline-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </span>
        <span id="settingsHeading">Settings</span>
      </div>

      <label for="mergeMultilineCheckbox" class="checkbox-label">
        <input type="checkbox" id="mergeMultilineCheckbox" />
        <span id="mergeMultilineLabel">Merge multi-line selection into a single line</span>
      </label>

      <div class="settings-group">
        <label for="ttsVoiceSelect" id="ttsVoiceLabel">TTS voice</label>
        <select id="ttsVoiceSelect"></select>
        <label for="autoTtsCheckbox" class="checkbox-label">
          <input type="checkbox" id="autoTtsCheckbox" />
          <span id="autoTtsLabel">Auto-read selected text</span>
        </label>
        <label for="hoverButtonsCheckbox" class="checkbox-label">
          <input type="checkbox" id="hoverButtonsCheckbox" />
          <span id="hoverButtonsLabel">Show inline icons on hover (experimental)</span>
        </label>

        <div id="siteConfigSection" class="site-config-section">
          <details>
            <summary class="site-config-summary">
              <span class="inline-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="4" x2="20" y1="9" y2="9" />
                  <line x1="4" x2="20" y1="15" y2="15" />
                  <line x1="10" x2="8" y1="3" y2="21" />
                  <line x1="16" x2="14" y1="3" y2="21" />
                </svg>
              </span>
              <span id="siteConfigHeading">Site selector rules</span>
            </summary>
            <div class="site-config-actions">
              <button type="button" id="addSiteConfigBtn" class="btn-secondary btn-compact">Add rule</button>
              <button type="button" id="getCurrentSiteBtn" class="btn-secondary btn-compact">Use current site</button>
            </div>
            <div id="siteConfigList" class="site-config-list"></div>
          </details>
        </div>
      </div>
    </div>

    <div id="statusBanner" class="status-banner" role="status" aria-live="polite" hidden></div>

    <div class="buttons">
      <button type="button" id="copyMarkdownBtn">Copy as Markdown</button>
      <button type="button" id="clearNotesBtn">Copy &amp; Clear</button>
    </div>

    <footer class="popup-footer">
      <span id="madeByIf9" class="made-by">Made by if9</span>
      <a id="websiteLink" class="website-link" href="https://tiny-memo.if9.cool/" target="_blank" rel="noopener noreferrer">
        <span id="websiteLinkLabel">Website</span>
        <span class="inline-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 7h10v10" />
            <path d="M7 17 17 7" />
          </svg>
        </span>
      </a>
    </footer>

    <div id="configModal" class="modal-backdrop" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h4 id="modalTitle" class="modal-title">Add site selector rule</h4>
        <div class="modal-field">
          <label for="domainInput" id="domainInputLabel">Domain</label>
          <input type="text" id="domainInput" placeholder="e.g. example.com" />
        </div>
        <div class="modal-field">
          <label for="selectorInput" id="selectorInputLabel">CSS selector</label>
          <input type="text" id="selectorInput" placeholder="e.g. .article-content p" />
        </div>
        <div id="modalStatus" class="modal-status" role="alert" hidden></div>
        <div class="modal-actions">
          <button type="button" id="cancelConfigBtn" class="btn-secondary">Cancel</button>
          <button type="button" id="saveConfigBtn" class="btn-primary">Save</button>
        </div>
      </div>
    </div>

    <script src="i18n-catalog.js"></script>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
